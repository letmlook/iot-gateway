name: Release

# 打 tag（v*）时构建发布产物并创建 GitHub Release。
# 产物：gateway / gateway-plugin-host / 插件 .so / 前端静态资源 / config / deploy，
# 附带 SHA256SUMS；容器镜像推送 GHCR（T4，蓝图 M3）。
# Windows 与多平台矩阵待定（见 docs/多租户决策方案.md 同级的未决问题）。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe 需要完整历史才能给出正确的版本号
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # kafka 插件发布包做真实构建（kafka-client feature，rdkafka-sys 源码编译）：
      # 需要 CMake 与 librdkafka 的系统依赖；镜像构建（Dockerfile）保持 stub 口径，
      # 两者差异见 Dockerfile 注释。
      - name: Install native deps for kafka plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libclang-dev libcurl4-openssl-dev libsasl2-dev libssl-dev libzstd-dev

      - name: Package
        run: ./scripts/package-release.sh

      - name: Show artefacts
        run: ls -la dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

  docker:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # v2.0-beta.1 / v2.0.0 → 镜像 tag 2.0-beta.1、2.0、2.0.x（不推 latest：
      # prerelease 不占 latest 位，正式版打 tag 时再显式补）
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


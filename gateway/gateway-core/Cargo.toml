[package]
name = "gateway-core"
version = "0.1.0"
edition = "2021"
description = "核心：消息总线、路由、节点/组/标签管理"

[dependencies]
gateway-sdk = { path = "../gateway-sdk" }
libloading = "0.8"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
dashmap = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }

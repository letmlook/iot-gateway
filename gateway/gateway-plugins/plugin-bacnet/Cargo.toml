[package]
name = "plugin-bacnet"
version = "0.1.0"
edition = "2021"
description = "南向 BACnet/IP 插件：通过 UDP 47808 连接 BACnet 设备（自研协议栈，零第三方 BACnet 依赖）"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
ffi = []

[dependencies]
gateway-sdk = { path = "../../gateway-sdk" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[package]
name = "plugin-s7"
version = "0.1.0"
edition = "2021"
description = "Siemens S7 south plugin for S7-300/400/1200/1500 PLCs - ISO-TCP (RFC1006)"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["real-impl"]
real-impl = ["dep:bytes"]
ffi = []  # 构建 .so/.dll 时启用

[dependencies]
gateway-sdk = { path = "../../gateway-sdk" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
bytes = { version = "1", optional = true }

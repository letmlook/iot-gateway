[package]
name = "plugin-http"
version = "0.1.0"
edition = "2021"
description = "HTTP webhook north plugin — POST data to REST endpoints"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["http-client"]
http-client = ["dep:reqwest"]
ffi = []

[dependencies]
gateway-sdk = { path = "../../gateway-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
once_cell = "1.19"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }
reqwest = { version = "0.12", features = ["json", "blocking"], default-features = false, optional = true }

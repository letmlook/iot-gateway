[package]
name = "plugin-kafka"
version = "0.1.0"
edition = "2021"
description = "北向插件：Kafka 生产"

[lib]
crate-type = ["lib", "cdylib"]

[features]
# rdkafka is heavy (C library) — default feature skips it so CI can compile without librdkafka
default = []
# kafka-client = rdkafka 编译，包含完整 Kafka 生产实现
kafka-client = ["dep:rdkafka"]
ffi = []

[dependencies]
gateway-sdk = { path = "../../gateway-sdk" }
gateway-plugin-common = { path = "../../gateway-plugin-common" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# rdkafka: version verified via cargo info as 0.39.0
# cmake-build is REQUIRED on Windows (rdkafka-sys build.rs: non-cmake path is configure/make which doesn't work on Windows)
# libz-static avoids Windows runtime zlib DLL dependency
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "cmake-build", "libz-static"], optional = true }

[dev-dependencies]
# FFI 导出符号存在性测试（tests/ffi_exports.rs）：用真实宿主 loader 验证 cdylib 可被加载注册
gateway-core = { path = "../../gateway-core" }
libloading = "0.8"

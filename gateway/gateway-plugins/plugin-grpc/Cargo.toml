[package]
name = "plugin-grpc"
version = "0.1.0"
edition = "2021"

[dependencies]
gateway-sdk = { path = "../../gateway-sdk" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
http = "1"
http-body-util = "0.1"
bytes = "1"
once_cell = "1"
http-body = "1"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
prost-build = "0.13"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[package]
name = "plugin-profinet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]
path = "src/lib.rs"

[features]
default = []
ffi = []

[dependencies]
gateway-sdk = { path = "../../gateway-sdk" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
once_cell = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

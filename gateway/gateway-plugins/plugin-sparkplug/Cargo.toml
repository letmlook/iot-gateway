[package]
name = "plugin-sparkplug"
version = "0.1.0"
edition = "2021"

[dependencies]
gateway-sdk = { path = "../../gateway-sdk" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[package]
name = "plugin-mitsubishi-mc"
version = "0.1.0"
edition = "2021"
description = "Mitsubishi MELSEC PLC communication protocol (MC-3E/4E)"

[lib]
crate-type = ["lib", "cdylib"]

[features]
ffi = []  # 构建 .so/.dll 时启用

[dependencies]
gateway-sdk = { path = "../../gateway-sdk" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"

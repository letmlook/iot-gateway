[package]
name = "plugin-iec61850"
version = "0.1.0"
edition = "2021"
description = "IEC 61850 MMS protocol plugin for substation automation"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["real-impl"]
real-impl = []
ffi = []

[dependencies]
gateway-sdk = { path = "../../gateway-sdk" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[package]
name = "plugin-influxdb"
version = "0.1.0"
edition = "2021"
description = "北向插件：InfluxDB v2 行协议写入"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["http-client"]
http-client = ["gateway-plugin-common/http"]
ffi = []

[dependencies]
gateway-sdk = { path = "../../gateway-sdk" }
gateway-plugin-common = { path = "../../gateway-plugin-common" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

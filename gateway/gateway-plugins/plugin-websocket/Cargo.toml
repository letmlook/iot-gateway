[package]
name = "plugin-websocket"
version = "0.1.0"
edition = "2021"

[dependencies]
gateway-sdk = { path = "../../gateway-sdk" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-native-certs"] }
rustls-native-certs = "0.7"
futures-util = "0.3"
once_cell = "1"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

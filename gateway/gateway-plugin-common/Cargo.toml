[package]
name = "gateway-plugin-common"
version = "0.1.0"
edition = "2021"
description = "北向插件共享基础设施：离线队列、格式化、配置辅助、HTTP 客户端、行协议编码器"

[lib]
crate-type = ["lib"]

[features]
default = []
http = ["dep:reqwest"]

[dependencies]
gateway-sdk = { path = "../gateway-sdk" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

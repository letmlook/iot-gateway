[package]
name = "gateway-server"
version = "0.1.0"
edition = "2021"
description = "HTTP API、插件加载、Web 服务入口"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
gateway-sdk = { path = "../gateway-sdk" }
gateway-core = { path = "../gateway-core" }
gateway-flow = { path = "../gateway-flow" }
plugin-sim = { path = "../gateway-plugins/plugin-sim" }
plugin-mqtt = { path = "../gateway-plugins/plugin-mqtt" }
plugin-modbus-tcp = { path = "../gateway-plugins/plugin-modbus-tcp" }
plugin-modbus-rtu = { path = "../gateway-plugins/plugin-modbus-rtu" }
axum = { version = "0.7", features = ["json", "macros", "multipart", "tokio", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tower = "0.4"
mime_guess = "2"
aes-gcm = "0.10"
sha2 = "0.10"
flate2 = "1.0"
rand = "0.8"
# 离线授权：机器码、RSA 验签
machineid-rs = "1.2"
mac_address = "1.1"
rsa = { version = "0.9", features = ["sha2"] }
pkcs8 = "0.10"
spki = "0.7"
base64 = "0.21"
hex = "0.4"
# 用户管理：SQLite 存储、密码哈希
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"

[package]
name = "gateway-server"
version = "0.1.0"
edition = "2021"
description = "HTTP API、插件加载、Web 服务入口"

[lib]
name = "gateway_server"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export-openapi.rs"

[dependencies]
gateway-sdk = { path = "../gateway-sdk" }
gateway-core = { path = "../gateway-core" }
plugin-sim = { path = "../gateway-plugins/plugin-sim" }
plugin-mqtt = { path = "../gateway-plugins/plugin-mqtt" }
plugin-http = { path = "../gateway-plugins/plugin-http" }
plugin-influxdb = { path = "../gateway-plugins/plugin-influxdb" }
plugin-tdengine = { path = "../gateway-plugins/plugin-tdengine" }
plugin-modbus-tcp = { path = "../gateway-plugins/plugin-modbus-tcp" }
plugin-modbus-rtu = { path = "../gateway-plugins/plugin-modbus-rtu" }
plugin-s7 = { path = "../gateway-plugins/plugin-s7" }
plugin-bacnet = { path = "../gateway-plugins/plugin-bacnet" }
plugin-ethernet-ip = { path = "../gateway-plugins/plugin-ethernet-ip" }
axum = { version = "0.7", features = ["json", "macros", "multipart", "tokio", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
mime_guess = "2"
aes-gcm = "0.10"
sha2 = "0.10"
flate2 = "1.0"
rand = "0.8"
# 离线授权：机器码、RSA 验签
machineid-rs = "1.2"
mac_address = "1.1"
rsa = { version = "0.9", features = ["sha2"] }
pkcs8 = "0.10"
spki = "0.7"
base64 = "0.21"
hex = "0.4"
# 用户管理：SQLite 存储、密码哈希
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
# 硬件信息（/api/hardware）：CPU、内存、系统版本
sysinfo = "0.29"
# OpenAPI
utoipa = { version = "5.5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8.1", features = ["axum", "vendored"] }
# WebSocket
bitflags = "2"
futures-util = "0.3"

[dev-dependencies]
# 集成测试：用 oneshot 直接打 axum Router
tower = { version = "0.4", features = ["util"] }
tokio-tungstenite = "0.26"

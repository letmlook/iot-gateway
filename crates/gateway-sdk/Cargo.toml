[package]
name = "gateway-sdk"
version = "0.1.0"
edition = "2021"
description = "SDK、插件 trait 与共享类型，南/北向插件均依赖此库"

[dependencies]
async-trait = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[package]
name = "gateway-server"
version = "0.1.0"
edition = "2021"
description = "HTTP API、插件加载、Web 服务入口"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
gateway-sdk = { path = "../gateway-sdk" }
gateway-core = { path = "../gateway-core" }
gateway-plugin-sim = { path = "../gateway-plugin-sim" }
gateway-plugin-mqtt = { path = "../gateway-plugin-mqtt" }
axum = { version = "0.7", features = ["json", "macros", "tokio", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tower = "0.4"
mime_guess = "2"
